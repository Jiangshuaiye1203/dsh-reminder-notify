# ============================================================================
# dsh-reminder-notify —— DSH bundle patch
# ============================================================================
# 插件挂载声明：DSH 启动时按 bundle 层栈叠加各插件 patch，把本插件的 row
# 插入 profile 的配置树。row id 与包名同名，便于在插件页找到它。
#
# 安装（不需要手工改 profile 的 patch）：
#   dsh plugin --profile desktop add link:<本目录绝对路径>
# 或直接用 DSH 的 plugin_manager install_bundle target=<本目录绝对路径>。
#
# config 里的每一项都可以在插件页 / cordis.patch.yml 里改；这里给的是默认值。
# ============================================================================

- insert:
    - id: dsh-reminder-notify
      name: dsh-reminder-notify
      config:
        # 宿主模式：
        #   script（默认）= 包内 host/ReminderHost.ps1，用系统自带 PowerShell + WinForms
        #                   在运行期编译绘制，仓库里没有 exe，不会被 SmartScreen 拦。
        #   exe          = 老的 Harness完成提醒.exe，只给已装客户端的机器留的兼容开关。
        hostMode: script
        # 脚本宿主路径；留空 = 包内 host/ReminderHost.ps1
        scriptPath: ''
        # 调 PowerShell 用的可执行文件，一般不用改
        powershellPath: powershell.exe
        # exe 模式下生效：空的 clientDir = 用包内 assets/；填绝对路径则用外部客户端目录
        clientDir: ''
        # 提示音目录；留空 = 包内 assets/提示音导入/
        audioDir: ''
        # 弹窗停留秒数（2–600）
        seconds: 60
        # 弹窗位置：br = 右下角（默认）、center = 居中、tr = 右上角
        position: br
        # 是否播放提示音；工具调用时传 sound:false 可以只弹窗不出声
        sound: true
        # 提示音文件名，在 audioDir 下解析
        doneAudio: 完成提醒语音.wav
        decideAudio: 需要你来决定.wav
        # raw 档位的默认音频；留空 = 静音
        rawAudio: ''
        # 卡片左侧强调色（#RRGGBB）
        accentDone: '#2ECC71'
        accentDecide: '#F5A623'
        accentRaw: '#4C8DFF'
        # 同档位提醒的最小间隔（毫秒），防止模型在同一轮重复调用
        cooldownMs: 1500
        # ===== 0.11 新增 =====
        # 用系统语音朗读卡片内容（需要中文语音包，没装就静音）
        speakEnabled: false
        # 卡片右下角显示「知道了 / 稍后提醒」按钮
        buttonsEnabled: true
        # 点「稍后提醒」后隔多久再弹（分钟）
        snoozeMinutes: 10
        # 多条提醒排队显示，不同时叠在屏幕上
        queueEnabled: true
        # 队列最多保留几条，超出的丢最旧的
        queueMax: 5
        # 同档位在这段时间内再次触发会并进排队中的那一条（毫秒，0 = 不合并）
        mergeWindowMs: 3000
        # 免打扰时段：到点不弹「完成」和普通提醒；「需要你来决定」不受影响
        quietEnabled: false
        quietStart: '22:00'
        quietEnd: '08:00'
        # hold = 留到时段结束后补弹；skip = 这段时间内直接跳过
        quietMode: hold
        # 前台是全屏应用时改用窄卡片
        compactOnFullscreen: true
        # 记录每条提醒的结果（自动关闭 / 点按钮 / 稍后 / 免打扰跳过）
        historyEnabled: true
        # 历史保留条数
        historyLimit: 200
        # 历史文件路径；留空 = ~/.dsh/dsh-reminder-notify/history.json
        historyFile: ''
        # 每天在固定时间弹一条「今日提醒日报」
        digestEnabled: false
        # 日报时间，HH:MM（过点后的第一次检查才会发，一天只发一条）
        digestTime: '09:00'
        digestTitle: 今日提醒日报
        # 日报里带上当前 DeepSeek 余额
        digestIncludeBalance: true
        # 当天提醒超过这个条数就额外弹一张预警卡（0 = 关）
        digestAlertCount: 0
        # 内部状态：上次发日报 / 弹预警的日期
        digestLastDate: ''
        digestAlertDate: ''
        # 把提醒同时推到手机（企业微信机器人 / Server 酱 / 自定义 webhook）
        pushEnabled: false
        # 推送地址
        pushUrl: ''
        # wecom = 企业微信机器人；serverchan = Server 酱；json = 通用 JSON；text = 纯文本
        pushFormat: wecom
        # 「需要你来决定」档位也推到手机
        pushDecide: true
        # 日报同时推到手机
        pushDigest: true
